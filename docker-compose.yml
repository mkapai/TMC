
# TMC Docker Compose 配置
# 
# 镜像说明：
# - 默认从当前目录的 Dockerfile 构建本地镜像 my-python-app:latest
# - 修改代码后使用 docker compose up -d --build 重新构建并启动
#
# 使用方法：
#   首次启动或代码更新: docker compose up -d --build
#   仅启动已有本地镜像: docker compose up -d --no-build

services:
  tmc:
    build:
      context: .
      dockerfile: Dockerfile
    image: my-python-app:latest
    pull_policy: build
    container_name: tmc-local
    restart: always
    ports:
      - "${APP_PORT:-9393}:9393"
    environment:
      # 时区配置
      - TZ=${TZ:-Asia/Shanghai}
      
      # === Telegram 客户端配置（完全可选）===
      # 【推荐】通过 Web 界面为每个客户端单独配置，无需在此填写
      # 以下仅作为默认值，当客户端未单独配置时使用
      - API_ID=23056861
      - API_HASH=23ec1f145112a49d9b08515c8701ce18
      - BOT_TOKEN=${BOT_TOKEN:-}
      - PHONE_NUMBER=${PHONE_NUMBER:-}
      
      # 代理配置（可选，外网环境通常不需要）
      - ENABLE_PROXY=${ENABLE_PROXY:-false}
      - PROXY_TYPE=${PROXY_TYPE:-http}
      - PROXY_HOST=${PROXY_HOST:-127.0.0.1}
      - PROXY_PORT=${PROXY_PORT:-7890}
      
      # 权限配置（NAS推荐，避免权限问题）
      # 如需自定义用户ID，请修改以下值或在 .env 中设置 PUID 和 PGID
      - PUID=1000
      - PGID=1000
      
      # 数据库配置
      - DATABASE_URL=${DATABASE_URL:-sqlite:////app/data/bot.db}
      
      # 日志级别
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      
    volumes:
      # 重要数据目录（建议使用绝对路径）
      - ${DATA_PATH:-./data}:/app/data              # 数据库和数据文件（重要）
      - ${LOGS_PATH:-./logs}:/app/logs              # 应用日志
      - ${SESSIONS_PATH:-./sessions}:/app/sessions  # Telegram会话文件（重要：登录状态）
      - ${TEMP_PATH:-./temp}:/app/temp              # 临时文件
      - ${CONFIG_PATH:-./config}:/app/config        # 配置文件目录

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9393/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - tmc-network

networks:
  tmc-network:
    name: tmc-network
    driver: bridge
